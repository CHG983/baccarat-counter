name: Deploy v5 from URL
on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL of the file to deploy"
        required: true
        type: string
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and validate
        run: |
          set -euo pipefail
          curl -fsSL "${{ inputs.url }}" -o /tmp/new
          size=$(wc -c < /tmp/new); echo "bytes: $size"
          [ "$size" -ge 85000 ] || { echo "::error::file too small"; exit 1; }
          for m in commission kelly cfg-decks kelly-card cfg-commission; do
            if grep -q "$m" /tmp/new; then echo "marker ok: $m"; else echo "::error::marker missing: $m"; exit 1; fi
          done
          python3 -c "s=open('/tmp/new',encoding='utf-8').read(); assert '<html' in s and '</html>' in s; assert s.count('<div')>50; print('structure ok', s.count('<div'))"
      - name: Commit
        run: |
          set -euo pipefail
          cp /tmp/new index.html
          git config user.name "Agent"
          git config user.email "agent@example.com"
          git add -A
          git diff --cached --quiet || { git commit -m "feat: update baccarat counter to v5 with shoe-count and commission settings"; git push; }
          sha256sum index.html
          wc -c index.html
