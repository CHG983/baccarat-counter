name: Deploy v11 bundle
on:
  workflow_dispatch:
    inputs:
      url: { description: "URL of the tar.gz bundle", required: true, type: string }
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and validate bundle
        run: |
          set -euo pipefail
          curl -fsSL "${{ inputs.url }}" -o /tmp/b.tar.gz
          sz=$(wc -c < /tmp/b.tar.gz); echo "bundle bytes: $sz"
          [ "$sz" -ge 100000 ] || { echo "::error::bundle too small"; exit 1; }
          mkdir -p /tmp/b && tar -xzf /tmp/b.tar.gz -C /tmp/b
          test -f /tmp/b/index.html
          test -f /tmp/b/README.md
          test -f /tmp/b/SETUP-AUTH.md
          test -f /tmp/b/versions/v11/index.html
          isz=$(wc -c < /tmp/b/index.html); echo "index bytes: $isz"
          [ "$isz" -ge 180000 ] || { echo "::error::index too small"; exit 1; }
          grep -q "renderCfgCheck" /tmp/b/index.html || { echo "::error::marker renderCfgCheck missing"; exit 1; }
          grep -q "cfg-check" /tmp/b/index.html || { echo "::error::marker cfg-check missing"; exit 1; }
          grep -q "AUTH_CFG" /tmp/b/index.html || { echo "::error::marker AUTH_CFG missing"; exit 1; }
          grep -q "GOOGLE_CLIENT_ID" /tmp/b/SETUP-AUTH.md || { echo "::error::SETUP-AUTH missing"; exit 1; }
          python3 -c "import re,sys; s=open('/tmp/b/index.html',encoding='utf-8').read(); b=re.findall(r'<script>(.*?)</script>', s, re.S); assert b, 'no inline script'; open('/tmp/inline.js','w',encoding='utf-8').write(max(b,key=len)); o=s.count(chr(123)); c=s.count(chr(125)); assert o==c, ('brace imbalance', o, c); print('braces', o, c)"
          node --check /tmp/inline.js
          echo "VALIDATION OK"
      - name: Commit
        run: |
          set -euo pipefail
          cp /tmp/b/index.html index.html
          cp /tmp/b/README.md README.md
          cp /tmp/b/SETUP-AUTH.md SETUP-AUTH.md
          mkdir -p versions/v11 && cp /tmp/b/versions/v11/index.html versions/v11/index.html
          git config user.name "Agent"
          git config user.email "agent@example.com"
          git add -A
          if git diff --cached --quiet; then echo "no changes"; else git commit -m "feat: deploy v11 with backend auth config checklist and setup guide"; git push; fi
          sha256sum index.html README.md SETUP-AUTH.md
