name: Deploy from URL
on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL of the file to deploy"
        required: true
        type: string
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and validate
        run: |
          set -euo pipefail
          curl -fsSL "${{ inputs.url }}" -o /tmp/new
          size=$(wc -c < /tmp/new)
          echo "bytes: $size"
          [ "$size" -ge 170000 ] || { echo "::error::file too small"; exit 1; }
          grep -q "auth-gate" /tmp/new || { echo "::error::marker auth-gate missing"; exit 1; }
          grep -q "app-shell" /tmp/new || { echo "::error::marker app-shell missing"; exit 1; }
          grep -q "baccarat-auth-v1" /tmp/new || { echo "::error::marker baccarat-auth-v1 missing"; exit 1; }
          grep -q "googleClientId" /tmp/new || { echo "::error::marker googleClientId missing"; exit 1; }
          python3 -c "import re,sys; s=open('/tmp/new',encoding='utf-8').read(); print('len ok', len(s))"
          node --version
      - name: Commit
        run: |
          set -euo pipefail
          cp /tmp/new index.html
          mkdir -p versions/v9
          cp /tmp/new versions/v9/index.html
          git config user.name "Agent"
          git config user.email "agent@example.com"
          git add -A
          git diff --cached --quiet || { git commit -m "feat: deploy v9 with Google login gate"; git push; }
          sha256sum index.html
